</div><script>
const R=document.getElementById('r'),st=document.getElementById('s');
const W=2557.76;let Z=1,vx=0,vy=0,pts=new Map(),lastD=0;
const ap=()=>R.setAttribute('transform',`translate(${vx} ${vy}) scale(${Z})`);
st.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});st.setPointerCapture(e.pointerId);});
st.addEventListener('pointermove',e=>{
 if(!pts.has(e.pointerId))return;
 const pr=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 const a=[...pts.values()],k=W/st.clientWidth;
 if(a.length===1){vx+=(e.clientX-pr.x)*k;vy+=(e.clientY-pr.y)*k;ap();}
 else if(a.length===2){
  const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
  if(lastD){const r=d/lastD,nz=Math.min(8,Math.max(1,Z*r));
   const cx=(c.x*k-vx)/Z,cy=(c.y*k-vy)/Z;vx=c.x*k-cx*nz;vy=c.y*k-cy*nz;Z=nz;ap();}
  lastD=d;}
});
['pointerup','pointercancel'].forEach(v=>st.addEventListener(v,e=>{pts.delete(e.pointerId);if(pts.size<2)lastD=0;}));
