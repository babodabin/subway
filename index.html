<style>
:root{--bg:#F3F1EC;--land:#FFFFFF;--out:#E4E0D8;--ink:#1F1F1F;--soft:#7A766E;--line:#E2DED5;--hot:#E5484D;--good:#1B8A4B;--mid:#C98A1B;--heat:255,110,60;--card:#FFFFFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
#map{position:fixed;inset:0;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;pointer-events:none}
#top .t1{font-size:26px;font-weight:800;letter-spacing:-.5px}
#top .t2{font-size:12px;color:var(--soft);margin-top:2px}
#top .r{text-align:right}
#cash{font-size:22px;font-weight:800}
#rep{font-size:12px;color:var(--soft);margin-top:2px}
#banner{position:fixed;top:66px;left:12px;right:12px;display:none;background:var(--ink);color:#fff;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.4}
#banner button{padding:8px 12px}
#toast{white-space:normal;text-align:center;line-height:1.4;border-radius:14px}
#banner b{font-size:14px}
#banner .bb{display:flex;gap:6px;margin-top:8px}
#petition{cursor:pointer;position:fixed;top:70px;left:16px;right:16px;display:none;background:#FFF4E5;border:1px solid #F2C27B;border-radius:12px;padding:9px 12px;font-size:13px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
button{white-space:nowrap;font:inherit;border:0;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002;cursor:pointer}
button.on{background:var(--ink);color:#fff}
button.go{background:#2357E0;color:#fff}
button.warn{background:var(--hot);color:#fff}
button:disabled{opacity:.4}
#bar .sp{flex:1}
#bar button{padding:10px 10px;font-size:13px}
#sheet{max-height:58vh;overflow-y:auto;position:fixed;left:8px;right:8px;bottom:8px;display:none;background:var(--card);border-radius:18px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 8px 30px #0003;max-width:520px;margin:0 auto}
#sheet h3{margin:0;font-size:19px}
#sheet .sub{font-size:12px;color:var(--soft);margin-top:2px}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:8px}
.big small{font-size:13px;font-weight:600;color:var(--soft);margin-left:4px}
.verdict{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:800;color:#fff;margin-left:6px;vertical-align:middle}
.rows{margin-top:6px;font-size:13px}
.rows div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line)}
.rows div:last-child{border:0}
.note{font-size:12px;color:var(--hot);margin-top:6px}
.btns{display:flex;gap:6px;margin-top:12px}
.btns button{flex:1}
#toast{position:fixed;left:50%;top:130px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#menu{position:fixed;inset:0;display:none;background:#0006;align-items:center;justify-content:center;padding:16px}
#menu .box{background:var(--card);border-radius:16px;padding:18px;max-width:420px;width:100%;font-size:14px;line-height:1.6}
#menu h2{margin:0 0 6px;font-size:20px}

  <h2>서울 지하철을 만들자</h2>
  <div id="menuinfo"></div>
  <p>빈 땅을 누르면 그 자리 주변에 사람이 얼마나 있는지 보입니다. 마음에 들면 역을 짓고, 역을 눌러 노선을 이으세요.</p>
  <p>· 역이 닿지 않는 곳에 사람이 많으면 주민 불만(😠)이 쌓이고 평판과 수입이 떨어집니다.<br>
  · 역을 너무 붙여 지으면 손님을 나눠 갖고, 서는 횟수가 늘어 노선이 느려집니다.</p>

  const i0=Math.max(0,Math.floor((px-R-bx0)/C)),i1=Math.min(GW-1,Math.floor((px+R-bx0)/C));

  let r=f*tot;for(let k=0;k<seg.length;k++){if(r<=seg[k]||k===seg.length-1){const a=sxy(ids[k]),b=sxy(ids[k+1]),u=seg[k]?Math.min(1,r/seg[k]):0;return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];}r-=seg[k];}return sxy(ids[0]);}
/* ───────── 글자 ───────── */
function won(v){const neg=v<0;let n=Math.round(Math.abs(v));const e=Math.floor(n/1e8),m=Math.floor(n%1e8/1e4);
  if(e)return(neg?'−':'')+e.toLocaleString()+'억'+(m&&e<100?' '+m.toLocaleString()+'만':'');if(m)return(neg?'−':'')+m.toLocaleString()+'만';return(neg?'−':'')+n.toLocaleString()+'원';}
const ppl=v=>v>=10000?(v/10000).toFixed(1)+'만':Math.round(v).toLocaleString();
const $=id=>document.getElementById(id);
function hud(){
  const h=Math.floor(S.t*24),m=Math.floor((S.t*24-h)*60);
  $('clock').textContent=S.day+'일차 '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  const net=dailyIncome()-dailyCost();
  $('riders').textContent='하루 손님 '+ppl(RIDERS)+'명 · 하루 '+(net>=0?'+':'')+won(net);
  $('cash').textContent=won(S.cash);$('cash').style.color=S.cash<0?'var(--hot)':'';
  const r=repOf();$('rep').textContent=(r>=80?'😊':r>=55?'😐':'😠')+' 평판 '+r;
  const pe=$('petition');
  if(S.petition&&!draft){const p=S.petition;pe.style.display='block';pe.innerHTML='📣 <b>'+F.names[p.p]+' 주변 주민 '+ppl(W[p.p])+'명</b>이 역을 요구합니다 · '+Math.max(0,Math.ceil(p.until-S.day-S.t))+'일 남음<br><span style="color:var(--soft)">점선 원 안에 노선이 닿는 역을 열면 지원금 '+won(p.reward)+' · 눌러서 위치 보기</span>';}
  else pe.style.display='none';
}
let toastT=0;function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,2400);}
/* ───────── 아래 카드 ───────── */
function sheet(html){const s=$('sheet');if(!html){s.style.display='none';$('bar').style.display='flex';return;}s.innerHTML=html;s.style.display='block';$('bar').style.display='none';}
function showSpot(x,y){
  const e=evaluate(x,y),c=CFG.stationCost+(draft?trackCost(draft,[x,y]):0);
  preview={x,y};
  const btn='<div class="btns"><button onclick="cancelSpot()">취소</button><button class="go" '+(S.cash<c?'disabled':'')+' onclick="buildHere()">'+(draft?'짓고 잇기 · ':'역 짓기 · ')+won(c)+'</button></div>';
  let h;
  if(draft){
    // 잇는 중: 지도를 가리지 않게 핵심만 — 간격 판정, 늘어나는 손님, 공사비
    const dg=draftGain(x,y,-1),m=Math.hypot(x-S.stations[draftEnd()].x,y-S.stations[draftEnd()].y),gr=gapGrade(m);
    h='<h3>'+autoName(x,y)+'</h3>'
      +'<div class="big">'+(dg.gain>=0?'+':'')+ppl(dg.gain)+'명<small>하루 손님</small><span class="verdict" style="background:'+gr.c+'">'+(m/1000).toFixed(1)+'km · '+gr.t+'</span></div>'
      +'<div class="note" style="color:'+gr.c+'">'+gr.why+(e.steal>3000?' · 다른 역 손님 '+ppl(e.steal)+'명을 뺏어 옵니다':'')+'</div>'+btn;
  }else{
    h='<h3>'+autoName(x,y)+'</h3><div class="sub">걸어서 '+CFG.walk+'m 안</div>'
      +'<div class="big">'+ppl(e.gain)+'명<small>역이 안 닿던 주변 사람</small><span class="verdict" style="background:'+e.vc+'">'+e.v+'</span></div>'
      +'<div class="rows"><div><span>주변 사람 전체</span><b>'+ppl(e.around)+'명</b></div>'
      +'<div><span>다른 역에서 뺏어 오는 손님</span><b style="color:'+(e.steal>e.gain?'var(--hot)':'inherit')+'">'+ppl(e.steal)+'명</b></div>'
      +(e.near>=0?'<div><span>가장 가까운 역</span><b style="color:'+gapGrade(e.nd).c+'">'+S.stations[e.near].name+' '+(e.nd/1000).toFixed(1)+'km · '+gapGrade(e.nd).t+'</b></div>':'')+'</div>'
      +'<div class="note" style="color:var(--soft)">역을 지은 뒤 노선으로 이어야 손님이 탑니다.</div>'+btn;
  }
  sheet(h);draw();
}
window.cancelSpot=()=>{preview=null;if(draft)showDraft();else sheet('');draw();};
function trackCost(dr,xy){const l=S.lines[dr.li],end=dr.at?l.ids[l.ids.length-1]:l.ids[0];return dist(sxy(end),xy)/1000*CFG.trackKm;}
window.buildHere=()=>{
  const {x,y}=preview;const c=CFG.stationCost+(draft?trackCost(draft,[x,y]):0);if(S.cash<c)return;
  S.cash-=CFG.stationCost;S.stations.push({x,y,name:autoName(x,y)});const s=S.stations.length-1;preview=null;
  if(draft){addToDraft(s);}else{recompute();sel=s;showStation(s);toast(S.stations[s].name+' 역을 지었습니다 · 눌러서 노선을 이으세요');}
  save();draw();hud();
};
function showStation(s){
  sel=s;const st=S.stations[s];const lines=S.lines.map((l,i)=>[l,i]).filter(([l])=>l.ids.includes(s));
  let h='<h3>'+st.name+'</h3><div class="sub">'+(lines.length?lines.map(([l])=>'<b style="color:'+l.color+'">'+l.name+'</b>').join(' · '):'아직 노선이 없습니다')+'</div>';
  h+='<div class="big">'+ppl(STN_RIDERS[s]||0)+'명<small>하루 타는 손님</small></div>';
  const gotPop=(()=>{let v=0;for(let k=0;k<GW*GH;k++)if(OWN[k]===s)v+=POP[k];return v;})();
  h+='<div class="rows"><div><span>이 역이 맡은 주변 사람</span><b>'+ppl(gotPop)+'명</b></div></div>';
  if(!lines.length)h+='<div class="note" style="color:var(--soft)">노선에 이어야 손님이 탑니다.</div>';
  h+='<div class="btns" style="flex-wrap:wrap">';
  for(const [l,i] of lines){if(l.ids[l.ids.length-1]===s)h+='<button class="go" onclick="startDraft('+i+',1)">'+l.name+' 이어가기</button>';else if(l.ids[0]===s)h+='<button class="go" onclick="startDraft('+i+',0)">'+l.name+' 이어가기</button>';}
  h+='<button '+(S.lines.length>=CFG.maxLines?'disabled':'')+' onclick="newLine('+s+')">'+(lines.length?'여기서 갈래 노선':'여기서 새 노선')+'</button><button onclick="closeSheet()">닫기</button></div>';
  sheet(h);draw();
}
window.closeSheet=()=>{sel=-1;preview=null;sheet('');draw();};
/* ───────── 노선 잇기 ───────── */
window.newLine=s=>{
  const n=S.lines.length;S.lines.push({name:(n+1)+'호선',color:CFG.colors[n%CFG.colors.length],ids:[s]});
  draft={li:n,at:1,added:[]};showDraft();draftHelp();
};
window.startDraft=(li,at)=>{draft={li,at,added:[]};showDraft();draftHelp();};
function draftHelp(){toast('초록 고리 안(0.9~1.6km)이 알맞은 간격 · 빈 땅=역 짓고 잇기 · 같은 노선 다른 역=거기서 잇기');}
function gapSummary(l){if(l.ids.length<2)return'';const n={};for(let k=0;k+1<l.ids.length;k++){const t=gapGrade(dist(sxy(l.ids[k]),sxy(l.ids[k+1]))).t;n[t]=(n[t]||0)+1;}
  const col={'알맞음':'#5BD68A','조금 가까움':'#FFB054','조금 멂':'#FFB054','너무 가까움':'#FF7A7E','너무 멂':'#FF7A7E'};
  return '<br><span style="font-size:12px">'+Object.entries(n).map(([t,c])=>'<b style="color:'+col[t]+'">'+t+' '+c+'</b>').join(' · ')+'</span>';}
function showDraft(){
  const l=S.lines[draft.li],info=LINE_INFO[draft.li];sel=-1;
  const b=$('banner');b.style.display='block';
  b.innerHTML='<div style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:0"><b style="color:'+l.color+'">■</b> <b>'+l.name+'</b> · '+l.ids.length+'역'+(info&&info.km?' · '+Math.round(info.v)+'km/h':'')+gapSummary(l)+'</div>'
   +'<button onclick="undoDraft()" '+(draft.added.length?'':'disabled')+'>↶</button><button class="go" onclick="endDraft()">완료</button></div>';
  sheet('');$('bar').style.display='none';hud();draw();
}
function addToDraft(s){
  const l=S.lines[draft.li];
  if(l.ids.includes(s)){
    if(s===draftEnd()){toast('여기가 지금 잇고 있는 끝 역입니다');return;}
    if(s===l.ids[0]||s===l.ids[l.ids.length-1]){draft={li:draft.li,at:draft.at?0:1,added:[]};toast(S.stations[s].name+' 쪽 끝에서 잇습니다');showDraft();return;}
    if(S.lines.length>=CFG.maxLines){toast('노선은 '+CFG.maxLines+'개까지입니다');return;}
    window.endDraft(true);window.newLine(s);toast(S.stations[s].name+'에서 갈라지는 '+S.lines[S.lines.length-1].name+'을 시작합니다');return;}
  const end=draft.at?l.ids[l.ids.length-1]:l.ids[0],c=dist(sxy(end),sxy(s))/1000*CFG.trackKm;
  if(S.cash<c){toast('돈이 모자랍니다 · 선로 '+won(c));return;}
  S.cash-=c;if(draft.at)l.ids.push(s);else l.ids.unshift(s);draft.added.push({s,c});
  const before=RIDERS;recompute();const d=RIDERS-before;
  toast(S.stations[s].name+'까지 연결 · 선로 '+won(c)+(l.ids.length>=2?' · 하루 손님 '+(d>=0?'+':'')+ppl(d)+'명':''));
  save();showDraft();
}
window.undoDraft=()=>{const a=draft.added.pop();if(!a)return;const l=S.lines[draft.li];if(draft.at)l.ids.pop();else l.ids.shift();S.cash+=a.c;recompute();save();showDraft();};
window.endDraft=(quiet)=>{const l=S.lines[draft.li];if(l.ids.length<2){S.lines.splice(draft.li,1);if(!quiet)toast('역이 하나뿐이라 노선을 만들지 않았습니다');}
  draft=null;$('banner').style.display='none';preview=null;recompute();save();sheet('');hud();draw();};
/* ───────── 시간 ───────── */
window.setSpeed=v=>{S.speed=v;$('bpause').className=v===0?'on':'';$('b1').className=v===1?'on':'';$('b3').className=v===4?'on':'';};
window.toggleHeat=()=>{S.heat=!S.heat;$('bheat').className=S.heat?'on':'';draw();save();};
function endOfDay(){
  const inc=dailyIncome(),cost=dailyCost();
  // 주민 불만: 역이 안 닿는 사람이 많을수록 쌓이고, 닿으면 풀린다
  for(let p=0;p<NP;p++){const un=W[p]*(1-SERVED_SHARE[p]);
    S.anger[p]=Math.max(0,Math.min(100,S.anger[p]+(S.day>4?un/6000:0)-SERVED_SHARE[p]*18));}
  // 민원
  if(S.petition){const p=S.petition.p;
    if(S.stations.some((s,i)=>onLine(i)&&dist([s.x,s.y],PT[p])<=CFG.walk)){S.cash+=S.petition.reward;S.anger[p]=0;toast('📣 '+F.names[p]+' 주민 요구를 들어줬습니다 · 지원금 '+won(S.petition.reward));S.petition=null;S.nextPet=S.day+4;}
    else if(S.day+1>=S.petition.until){S.anger[p]=100;toast('😠 '+F.names[p]+' 주민 요구를 놓쳤습니다 · 불만이 폭발했습니다');S.petition=null;S.nextPet=S.day+4;}}
  else if(S.day>=S.nextPet){let b=-1,bv=0;for(let p=0;p<NP;p++){const v=S.anger[p]*W[p]*(1-SERVED_SHARE[p]);if(S.anger[p]>30&&v>bv){bv=v;b=p;}}
    if(b>=0){S.petition={p:b,until:S.day+1+8,reward:Math.round(W[b]*4e4/1e8)*1e8+10e8};toast('📣 '+F.names[b]+' 주민이 역을 요구합니다');}}
  S.day++;
  drawHeat();
  return inc-cost;
}
let last=performance.now(),acc=0;
function frame(ts){
  const dt=Math.min(.1,(ts-last)/1000);last=ts;now=ts;
  if(S.speed&&!draft&&$('sheet').style.display!=='block'||S.speed&&false){}
  if(S.speed){const dd=dt*S.speed/CFG.daySec;S.cash+=(dailyIncome()-dailyCost())*dd;S.t+=dd;
    if(S.t>=1){S.t-=1;endOfDay();save();}
    acc+=dt;if(acc>.25){acc=0;hud();}}
  draw();requestAnimationFrame(frame);
}
/* ───────── 손가락·마우스 ───────── */
const pts=new Map();let downAt=null,moved=false,pinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1){downAt=[e.clientX,e.clientY,performance.now()];moved=false;}pinch=0;});
let hover=null;
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'&&!pts.size){if(draft){const x=wx(e.clientX),y=wy(e.clientY);hover={x,y,s:hitStation(e.clientX,e.clientY)};}else hover=null;return;}
  if(!pts.has(e.pointerId))return;const p0=pts.get(e.pointerId);
  if(pts.size===1){const dx=e.clientX-p0[0],dy=e.clientY-p0[1];OX+=dx;OY+=dy;if(downAt&&Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>8)moved=true;}
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){moved=true;const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;if(pinch)zoomAt(mx,my,d/pinch);pinch=d;}
  draw();});
const up=e=>{const was=pts.has(e.pointerId);pts.delete(e.pointerId);if(pts.size<2)pinch=0;if(was&&pts.size===0&&!moved&&downAt)tap(e.clientX,e.clientY);if(pts.size===0)downAt=null;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);pinch=0;});
cv.addEventListener('pointerleave',()=>{hover=null;});
function hitStation(X,Y){const rr=Math.max(22,160*Z);let hit=-1,hd=rr;S.stations.forEach((s,i)=>{const d=Math.hypot(sx(s.x)-X,sy(s.y)-Y);if(d<hd){hd=d;hit=i;}});return hit;}
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015));draw();},{passive:false});
function zoomAt(X,Y,f){const nz=Math.max(.008,Math.min(.6,Z*f));f=nz/Z;OX=X-(X-OX)*f;OY=Y-(Y-OY)*f;Z=nz;}
function tap(X,Y){
  const hit=hitStation(X,Y);
  if(draft){if(hit>=0){preview=null;addToDraft(hit);}else{const x=wx(X),y=wy(Y);if(inRegion(x,y))showSpot(x,y);else toast('구 밖에는 지을 수 없습니다');}return;}
  if(hit>=0){preview=null;showStation(hit);return;}
  const x=wx(X),y=wy(Y);
  if(!inRegion(x,y)){closeSheet();toast('흰색 땅('+F.gus.join('·')+') 안에만 지을 수 있습니다');return;}
  sel=-1;showSpot(x,y);
}
/* ───────── 메뉴 ───────── */
window.goPetition=()=>{if(!S.petition)return;const p=S.petition.p;overview=false;$('bview').textContent='전체 보기';lookAt(PT[p][0],PT[p][1],3200);draw();};
window.openMenu=()=>{$('menuinfo').innerHTML='<p style="color:var(--soft)">'+F.gus.join('·')+' · 실제 역 '+NP+'곳의 승객 자료를 숨은 수요로 씁니다.<br>역 '+S.stations.length+'곳 · 노선 '+S.lines.length+'개 · 하루 운영비 '+won(dailyCost())+'</p>';$('menu').style.display='flex';};
window.closeMenu=()=>{$('menu').style.display='none';};
window.resetGame=()=>{S=fresh();draft=null;preview=null;sel=-1;$('banner').style.display='none';recompute();sheet('');closeMenu();setSpeed(1);startView();save();hud();};
let overview=false;
// 평소에는 내가 지은 곳만 크게 — 아직 없으면 사람이 가장 많은 곳을 가까이서
function startView(){
  overview=false;const b=$('bview');if(b)b.textContent='전체 보기';
  if(!S.stations.length){let b=0;for(let p=1;p<NP;p++)if(W[p]>W[b])b=p;lookAt(PT[b][0],PT[b][1],2800);return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const s of S.stations){x0=Math.min(x0,s.x);x1=Math.max(x1,s.x);y0=Math.min(y0,s.y);y1=Math.max(y1,s.y);}
  const span=Math.max(2200,(x1-x0)*1.35,(y1-y0)*1.35*Math.min(VW,VH*1.2)/VH);lookAt((x0+x1)/2,(y0+y1)/2,span);
}
// 축소해서 서울 지하철역 전부 보기
window.toggleView=()=>{
  if(overview){startView();draw();return;}
  overview=true;$('bview').textContent='내 역 보기';
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const P of [AREA,AROUND])for(const n in P)for(const poly of P[n])for(const [x,y] of poly[0]){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
  Z=Math.min(VW/(x1-x0),(VH-140)/(y1-y0))*.95;OX=VW/2-(x0+x1)/2*Z;OY=VH/2-(y0+y1)/2*Z;draw();
};
/* ───────── 시작 ───────── */
resize();addEventListener('resize',()=>{resize();draw();});
S=load()||fresh();
recompute();startView();setSpeed(S.speed??1);$('bheat').className=S.heat?'on':'';hud();
if(!S.seen){S.seen=true;openMenu();}
requestAnimationFrame(frame);
</script>
</body></html>
